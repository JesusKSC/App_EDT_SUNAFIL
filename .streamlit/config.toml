# Tema claro y oscuro: la app sigue el modo del sistema y se puede cambiar
# desde el menú ⋮ (arriba a la derecha) → Settings → Choose app theme.
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#E7EEF3"
textColor = "#1E293B"

[theme.dark]
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#16213A"
textColor = "#E2E8F0"

[client]
# "viewer" deja visible el menú ⋮ con Settings (para elegir claro/oscuro)
toolbarMode = "viewer"
